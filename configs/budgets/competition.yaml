schema_version: 1

# Tighter team recommendation for a complete local demo and a bounded research loop.
# Azure AI Foundry calls plan and patch code; model training uses the local machine.
# This block is cost-tracking documentation only; the fields below are not read by
# the workflow code (which enforces the token/experiment caps under `limits`).
azure:
  pricing_region: southeast-asia
  credit_limit_usd: 100
  allocation_usd:
    research_agent: 25
    code_recovery_agent: 55
    reserve: 20
  stop_before_credit_limit: true

# Supports B0 plus up to nine novel experiments, enough to apply the organizer's
# three-consecutive-non-improvement convergence rule without an open-ended loop.
limits:
  total_wall_seconds: 43200
  total_gpu_hours: 4
  bedrock_input_tokens: 6000000
  bedrock_output_tokens: 1200000
  maximum_experiments: 4
  # Hard stop for one full model. A timeout abandons the method and returns to research.
  per_run_timeout_seconds: 1800
  recovery_attempts_per_run: 2

# Hugging Face Papers/GitHub calls are free APIs (no LLM $ cost); these bound local
# compute/memory and keep raw tool responses reasonable. The context compiler
# (configs/agents/azure_foundry.yaml maximum_evidence_characters/maximum_mcp_evidence_records)
# separately bounds what actually reaches the agents, so these can be generous.
mcp:
  per_session:
    outbound_provider_requests: 400
    returned_documents: 600
    response_characters: 1500000
  per_experiment:
    outbound_provider_requests: 40
    returned_documents: 60
    response_characters: 150000

# Proxy results filter unsafe/expensive candidates; they never update the
# validation-best model or convergence counter.
proxy_tier:
  maximum_rows: 100000
  maximum_users: 5000
  maximum_wall_seconds: 600
  maximum_gpu_hours: 0.15

# Diversity policy. `fm_choosing_score` is the Research Agent's relative
# preference for FM-family hypotheses, not an unenforceable random probability.
# The spacing rule below is the hard guarantee.
research_strategy:
  fm_choosing_score: 0.15
  fm_family_names:
    - factorization_machine
    - fm
    - deepfm
    - deep_factorization_machine
  minimum_non_fm_between_fm: 3
  require_non_fm_first: false
  maximum_consecutive_same_model_family: 2
  semantic_duplicate_similarity: 0.72
  research_duplicate_retry_limit: 2
  maximum_consecutive_research_failures: 2
  innovation_minimum_delta_vs_baseline: 0.0
  ensemble_minimum_delta_vs_best: 0.002
  final_artifact_policy: validation_best_only
  minimum_eligible_models_for_ensemble: 2

resource_sampling:
  interval_seconds: 5

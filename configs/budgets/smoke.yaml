schema_version: 1

# Bounded smoke-test budget for the verification workflow described in
# Plan_Workflow.md (`uv run python -m rigor_rs.cli run --budget
# configs/budgets/smoke.yaml`). Not for competition use: one experiment only,
# short timeouts, small Azure AI Foundry allocation. See
# configs/budgets/competition.yaml for the real run's limits.
azure:
  pricing_region: southeast-asia
  credit_limit_usd: 5
  allocation_usd:
    research_agent: 2
    code_recovery_agent: 2
    reserve: 1
  stop_before_credit_limit: true

limits:
  total_wall_seconds: 3600
  total_gpu_hours: 1
  bedrock_input_tokens: 300000
  bedrock_output_tokens: 60000
  maximum_experiments: 1
  per_run_timeout_seconds: 900
  recovery_attempts_per_run: 1

mcp:
  per_session:
    outbound_provider_requests: 40
    returned_documents: 60
    response_characters: 150000
  per_experiment:
    outbound_provider_requests: 10
    returned_documents: 15
    response_characters: 40000

proxy_tier:
  maximum_rows: 20000
  maximum_users: 1000
  maximum_wall_seconds: 180
  maximum_gpu_hours: 0.05

resource_sampling:
  interval_seconds: 5

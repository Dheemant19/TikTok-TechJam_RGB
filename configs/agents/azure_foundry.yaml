schema_version: 1
provider: azure_ai_foundry

# Authentication values live only in the repository-root .env file.
# Endpoint/key/api_version are read once and shared by both agents; each
# agent only needs its own deployment name (see research_agent/code_recovery_agent
# below), since one Azure AI Foundry project can host multiple model deployments.
endpoint_env: AZURE_FOUNDRY_ENDPOINT
api_key_env: AZURE_FOUNDRY_API_KEY
api_version_env: AZURE_FOUNDRY_API_VERSION

research_agent:
  model_deployment_env: AZURE_RESEARCH_MODEL_DEPLOYMENT
  temperature: 0
  reasoning_effort: high
  timeout_seconds: 180
  transient_retry_limit: 2
  use_responses_api: true

code_recovery_agent:
  model_deployment_env: AZURE_CODE_MODEL_DEPLOYMENT
  temperature: 0
  reasoning_effort: high
  timeout_seconds: 300
  transient_retry_limit: 2
  # gpt-5.6-luna supports both Responses and Chat Completions APIs; Responses
  # is used here for feature parity with the research agent.
  use_responses_api: true

session_chat:
  model_deployment_env: AZURE_CHAT_MODEL_DEPLOYMENT
  temperature: 0
  reasoning_effort: medium
  timeout_seconds: 120
  transient_retry_limit: 2
  use_responses_api: true

structured_output:
  require_pydantic_validation: true
  reject_unknown_fields: true

context_limits:
  maximum_profile_characters: 24000
  maximum_run_records: 8
  maximum_mcp_evidence_records: 6
  maximum_evidence_characters: 30000
  maximum_patch_characters: 60000
  maximum_traceback_characters: 20000
  # Cumulative cap, per experiment, on reference code the Code Agent reads from a
  # checked-out worktree (Plan_Workflow.md #9) while porting an idea from a pinned
  # get_code_for_paper/search_code repository. MCP never returns file contents itself
  # (see Plan_MCP.md #2.4/#3.3); this bounds the agent's own selective on-disk reads
  # (grep-then-read specific files/functions) so one greedy read of a large repository
  # cannot dominate the experiment's token budget.
  maximum_reference_code_characters: 40000

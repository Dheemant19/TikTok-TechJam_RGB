[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "flowstate"
version = "0.1.0"
description = "Local autonomous recommender-system research workflow"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "fastembed>=0.7,<1",
  "httpx>=0.28,<1",
  "huggingface-hub>=0.35,<2",
  "langchain-azure-ai>=1.2,<2",
  "langchain-core>=0.3,<2",
  "langgraph>=0.6,<2",
  "langgraph-checkpoint-sqlite>=2,<4",
  "mcp[cli]>=1.28,<2",
  "numpy>=2.2,<3",
  "polars>=1.32,<2",
  "psutil>=7,<8",
  "pyarrow>=20,<24",
  "pydantic>=2.12,<3",
  "nvidia-ml-py>=13,<14",
  "python-dotenv>=1.1,<2",
  "PyYAML>=6.0,<7",
  "torch==2.11.0+cu128",
  "typer>=0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
]

[project.scripts]
flowstate = "flowstate.cli:main"
flowstate-mcp = "flowstate.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/flowstate"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

